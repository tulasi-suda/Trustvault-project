# Render deployment specification for TrustVault
services:
  - type: web
    name: trustvault
    env: node
    plan: free
    region: oregon
    buildCommand: npm --prefix frontend install --include=dev && npm --prefix frontend run build && npm --prefix backend install
    startCommand: cd backend && npm run db:migrate && npm run db:seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: STORAGE_BACKEND
        value: db
      - key: LOGIN_RATE_LIMIT_MAX
        value: 10
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-postgres
          property: connectionString
      - key: SEED_ADMIN_USERNAME
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: trustvault-web
          property: host

databases:
  - name: trustvault-postgres
    plan: free
    region: oregon
    databaseName: trustvault
    user: trustvault_user
